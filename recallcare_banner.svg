<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />

  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="1" opacity="0.18">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Pulse / Memory Wave Graphic -->
  <g transform="translate(60, 40)">
    <!-- Decorative Ambient Circle -->
    <circle cx="80" cy="140" r="70" fill="#38BDF8" opacity="0.08" />
    <circle cx="80" cy="140" r="50" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.3" />

    <!-- Pulse Icon with Memory Node Intersections -->
    <path d="M 20 140 L 45 140 L 58 105 L 72 175 L 85 120 L 98 150 L 110 135 L 125 140 L 150 140" 
          stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />

    <!-- Memory Nodes -->
    <circle cx="58" cy="105" r="4.5" fill="#38BDF8" />
    <circle cx="72" cy="175" r="4.5" fill="#818CF8" />
    <circle cx="85" cy="120" r="4.5" fill="#34D399" />
    <circle cx="98" cy="150" r="4.5" fill="#38BDF8" />
  </g>

  <!-- Center Text Information -->
  <g transform="translate(260, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 75)">
      <rect width="280" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="15" r="4" fill="#34D399" />
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">LONGITUDINAL CLINICAL MEMORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      Recall<tspan fill="url(#primaryGrad)">Care</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="20" font-weight="500" fill="#94A3B8">
      The clinical assistant that remembers every patient visit.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 255)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="190" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="95" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="12.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">🧠 Persistent Memory</text>

      <!-- Pill 2 -->
      <rect x="205" y="0" width="180" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="295" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="12.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">📊 Interpretable ML</text>

      <!-- Pill 3 -->
      <rect x="400" y="0" width="225" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="512" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="12.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">🔄 Closed-Loop Feedback</text>
    </g>
  </g>
</svg>
